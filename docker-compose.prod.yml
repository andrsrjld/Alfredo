services:
  alfredo:
    image: ${ALFREDO_IMAGE:-ghcr.io/andrsrjld/alfredo:latest}
    restart: unless-stopped
    env_file:
      # Keep this file on the server beside docker-compose.prod.yml.
      - ${ALFREDO_ENV_FILE:-.env}
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
    ports:
      - "${ALFREDO_PORT:-3000}:3000"
